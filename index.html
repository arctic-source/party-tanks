<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Party Tanks</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b1f27">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icons/icon-192.png">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
    font-family: sans-serif;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  #bar {
    flex: 0 0 auto;
    display: flex; align-items: center;
    gap: 6px;
    padding: 6px 8px;
    background: linear-gradient(180deg, var(--accent-bg, #1b1f27) 0%, #14161d 100%);
    border-bottom: 3px solid var(--accent, #000);
    box-shadow: 0 2px 12px var(--accent-glow, rgba(0,0,0,.4));
    box-sizing: border-box;
    z-index: 10;
    transition: background .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  .cluster { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
  .grp { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 0 0 auto; }
  .grp-label { font-size: 10px; color: #9aa; letter-spacing: .03em; white-space: nowrap; }
  .grp-label b { color: #fff; font-weight: bold; }
  .pair { display: flex; gap: 4px; flex: 0 0 auto; }

  button.ctl {
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    border: none; border-radius: 8px;
    background: #33394a; color: #fff;
    font-size: 18px; font-weight: bold;
    width: 44px; height: 44px;
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 0 #14161c;
  }
  button.ctl:active, button.ctl.held { background: #4c5570; box-shadow: 0 1px 0 #14161c; transform: translateY(1px); }
  button.ctl:disabled { opacity: .35; }

  #fireBtn {
    width: 64px; height: 44px; border-radius: 8px;
    background: #a8321f; font-size: 14px; letter-spacing: .05em;
  }
  #fireBtn:active, #fireBtn.held { background: #d1432c; }

  button.ctl.wideCtl {
    width: auto; flex-direction: row; gap: 4px;
    padding: 0 8px; font-size: 10px; letter-spacing: .01em;
    white-space: nowrap;
  }
  .wideCtl svg { flex: 0 0 auto; display: block; width: 14px; height: 14px; }

  #recenterBtn { height: 44px; background: #2a5d4a; }
  #recenterBtn:active { background: #367a61; }

  #fsBtn { height: 44px; background: #3a3a3a; }
  #fsBtn:active { background: #555; }

  #status {
    flex: 1 1 auto;
    display: flex; flex-direction: column; justify-content: center;
    gap: 3px;
    min-width: 0;
    overflow: hidden;
    color: #fff; font-size: 12px;
  }
  #turnLabel { font-weight: bold; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fuelWrap { width: 100%; height: 7px; background: #10131a; border-radius: 4px; overflow: hidden; }
  #fuelFill { height: 100%; width: 100%; background: #e0b93a; transition: width .05s linear; }

  #canvasWrap { flex: 1 1 auto; position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; background: #6f8fae; }

  #overlay {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.72);
    color: #fff; text-align: center; z-index: 20;
    flex-direction: column; gap: 16px;
  }
  #overlay.show { display: flex; }
  #overlay h1 { margin: 0; font-size: 28px; }
  #overlay button {
    font-size: 18px; padding: 12px 28px; border-radius: 10px;
    border: none; background: #2a5d4a; color: #fff; font-weight: bold;
  }

  #rotateMsg {
    position: absolute; inset: 0; z-index: 30;
    background: #10131a; color: #fff;
    display: none;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px; box-sizing: border-box;
    font-size: 18px;
  }
  @media (orientation: portrait) {
    #rotateMsg { display: flex; }
  }

  #toast {
    position: absolute; top: 12px; left: 50%;
    transform: translateX(-50%) translateY(-10px);
    background: rgba(20,10,5,0.9); color: #ffcf8a;
    font-size: 13px; font-weight: bold;
    padding: 8px 14px; border-radius: 8px;
    max-width: 90%; text-align: center;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 15; box-shadow: 0 3px 10px rgba(0,0,0,.4);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Pre-game screens ---------- */
  .screen {
    display: none;
    flex: 1 1 auto;
    flex-direction: column;
    min-height: 0;
  }
  .screen.show { display: flex; }

  #screenWelcome, #screenRounds {
    align-items: center; justify-content: center;
    gap: 22px; color: #fff; text-align: center;
    padding: 20px; box-sizing: border-box;
    background: #10131a;
  }
  .titleLogo { font-size: 34px; margin: 0; letter-spacing: .02em; }
  .screenTitle { margin: 6px 0 0; font-size: 18px; color: #fff; text-align: center; }

  .bigBtn {
    font-size: 17px; font-weight: bold; color: #fff;
    padding: 12px 30px; border-radius: 10px; border: none;
    background: #2a5d4a;
  }
  .bigBtn:active { background: #367a61; }
  .bigBtn.secondary { background: #33394a; }
  .bigBtn.secondary:active { background: #4c5570; }

  #screenPlayers {
    color: #fff; background: #10131a;
    padding: 10px 14px; box-sizing: border-box; gap: 8px;
  }
  .playerRows {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    display: flex; flex-direction: column; gap: 6px;
    padding: 2px;
  }
  .playerRow {
    display: flex; align-items: center; gap: 8px;
    background: #1b1f27; border-radius: 8px; padding: 6px 8px;
    flex: 0 0 auto;
  }
  .playerRow.slotDisabled { opacity: .38; pointer-events: none; }
  .slotNum { font-size: 11px; color: #9aa; width: 14px; text-align: center; flex: 0 0 auto; }
  .nameInput {
    flex: 1 1 auto; min-width: 0;
    background: #0e1016; color: #fff; border: 1px solid #333a4a;
    border-radius: 6px; padding: 7px 8px; font-size: 13px;
  }
  .colorSwatches { display: flex; gap: 3px; flex: 0 0 auto; }
  .swatchBtn {
    width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent;
    padding: 0; flex: 0 0 auto;
  }
  .swatchBtn.selected { border-color: #fff; }
  .swatchBtn:disabled { opacity: .25; }
  .modeToggle { display: flex; gap: 3px; flex: 0 0 auto; }
  .modeBtn {
    font-size: 11px; font-weight: bold; color: #fff; border: none;
    padding: 6px 9px; border-radius: 6px; background: #33394a;
  }
  .modeBtn.active { background: #2a5d4a; }
  .modeBtn:disabled { opacity: .35; }

  .screenNav { display: flex; gap: 10px; justify-content: center; flex: 0 0 auto; padding-top: 4px; }

  .configRows { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 340px; }
  .configRow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .configLabel { font-size: 12px; color: #9aa; letter-spacing: .04em; }
  .chipSelector { display: flex; align-items: center; gap: 8px; }
  .chipArrow {
    width: 30px; height: 30px; border-radius: 6px; border: none;
    background: #33394a; color: #fff; font-size: 13px;
  }
  .chipArrow:disabled { opacity: .3; }
  .chipValue { min-width: 110px; text-align: center; font-weight: bold; font-size: 14px; }
</style>
</head>
<body>
<div id="app">
  <div id="screenWelcome" class="screen show">
    <h1 class="titleLogo">Party Tanks</h1>
    <button id="newGameBtn" class="bigBtn">New Game</button>
  </div>

  <div id="screenPlayers" class="screen">
    <h2 class="screenTitle">Players</h2>
    <div id="playerRows" class="playerRows"></div>
    <div class="screenNav">
      <button id="playersNextBtn" class="bigBtn">Next</button>
    </div>
  </div>

  <div id="screenRounds" class="screen">
    <h2 class="screenTitle">Rounds &amp; Map</h2>
    <div class="configRows">
      <div class="configRow">
        <div class="configLabel">ROUNDS</div>
        <div class="chipSelector">
          <button class="chipArrow" disabled>&#9664;</button>
          <div class="chipValue">1</div>
          <button class="chipArrow" disabled>&#9654;</button>
        </div>
      </div>
      <div class="configRow">
        <div class="configLabel">MAP</div>
        <div class="chipSelector">
          <button class="chipArrow" disabled>&#9664;</button>
          <div class="chipValue">Chill Forest</div>
          <button class="chipArrow" disabled>&#9654;</button>
        </div>
      </div>
      <div class="configRow">
        <div class="configLabel">WIND</div>
        <div class="chipSelector">
          <button class="chipArrow" disabled>&#9664;</button>
          <div class="chipValue">None</div>
          <button class="chipArrow" disabled>&#9654;</button>
        </div>
      </div>
    </div>
    <div class="screenNav">
      <button id="roundsBackBtn" class="bigBtn secondary">Back</button>
      <button id="startGameBtn" class="bigBtn">Start Game</button>
    </div>
  </div>

  <div id="screenMatch" class="screen">
    <div id="bar">
      <button class="ctl wideCtl" id="fsBtn" aria-label="Toggle fullscreen">
        <svg id="fsIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9V4h5"></path><path d="M20 9V4h-5"></path><path d="M4 15v5h5"></path><path d="M20 15v5h-5"></path>
        </svg>
        <span id="fsLabel">Fullscreen</span>
      </button>
      <div class="cluster">
        <div class="grp">
          <div class="grp-label">MOVE</div>
          <div class="pair">
            <button class="ctl" id="btnLeft" aria-label="Move left">&#9664;</button>
            <button class="ctl" id="btnRight" aria-label="Move right">&#9654;</button>
          </div>
        </div>
      </div>

      <div id="status">
        <div id="turnLabel">Player 1's Turn</div>
        <div class="fuelWrap"><div id="fuelFill"></div></div>
      </div>

      <div class="cluster">
        <div class="grp">
          <div class="grp-label">ANGLE <b id="angleVal">55</b>&deg;</div>
          <div class="pair">
            <button class="ctl" id="btnAngleDown">&#9660;</button>
            <button class="ctl" id="btnAngleUp">&#9650;</button>
          </div>
        </div>
        <div class="grp">
          <div class="grp-label">POWER <b id="powerVal">55</b></div>
          <div class="pair">
            <button class="ctl" id="btnPowerDown">&minus;</button>
            <button class="ctl" id="btnPowerUp">&plus;</button>
          </div>
        </div>
        <button class="ctl wideCtl" id="recenterBtn" aria-label="Recenter camera on your tank">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"></circle>
            <circle cx="12" cy="12" r="7"></circle>
            <line x1="12" y1="1" x2="12" y2="4"></line>
            <line x1="12" y1="20" x2="12" y2="23"></line>
            <line x1="1" y1="12" x2="4" y2="12"></line>
            <line x1="20" y1="12" x2="23" y2="12"></line>
          </svg>
          <span>Recenter</span>
        </button>
        <button class="ctl" id="fireBtn" aria-label="Fire">FIRE</button>
      </div>
    </div>

    <div id="canvasWrap">
      <canvas id="c"></canvas>
      <div id="toast"></div>
      <div id="overlay">
        <h1 id="winText">Player 1 Wins!</h1>
        <button id="backToSetupBtn">Back to Setup</button>
      </div>
    </div>
  </div>
</div>
<div id="rotateMsg">Rotate your phone to landscape to play&hellip;</div>

<script>
(function () {
  "use strict";

  // ---------- Canvas setup ----------
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var canvasWrap = document.getElementById("canvasWrap");

  function resizeCanvas() {
    var rect = canvasWrap.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    VIEW_W = rect.width;
    VIEW_H = rect.height;
    if (typeof clampCam === "function") clampCam();
  }
  var VIEW_W = 0, VIEW_H = 0;
  window.addEventListener("resize", resizeCanvas);
  window.addEventListener("orientationchange", resizeCanvas);

  // ---------- Constants ----------
  var WORLD_W = 2200; // recomputed per match by computeArenaLayout()
  var PLAYER_SPACING = 1200; // world px between adjacent players at map-size 1x
  var WING_MARGIN = 500; // scenery/panning buffer beyond the outermost player, each side
  var MAP_SIZE_MULTIPLIER = 1.0; // future map-size selector (Small/Large) will drive this
  var ARENA_BUFFER = 300; // slack beyond the outermost player still treated as "the arena"
  var playerStartXs = []; // computed by computeArenaLayout(), one entry per active player
  var GRAVITY = 260; // px/s^2
  var MOVE_SPEED = 130; // px/s
  var FUEL_MAX = 100;
  var FUEL_PER_SEC = 22;
  var HEALTH_MAX = 100;
  var HIT_RADIUS = 26;
  var MIN_DAMAGE = 30; // grazing hit near the edge of HIT_RADIUS
  var MAX_DAMAGE = 70; // dead-center hit
  var CRATER_RADIUS = 18; // world px
  var CRATER_DEPTH = 0.05; // fraction of VIEW_H
  var ANGLE_MIN = 5, ANGLE_MAX = 175;
  var ANGLE_RATE = 55; // deg/sec while held
  var POWER_MIN = 15, POWER_MAX = 100;
  var POWER_RATE = 45; // units/sec while held
  var POWER_TO_SPEED = 7.2; // maps power units -> initial bullet speed px/s
  var TANK_HALF_W = 20, TANK_HALF_H = 12;
  var ZOOM_MIN = 0.5, ZOOM_MAX = 2.5;
  var TREE_BASE_HEIGHT = 40; // px at scale 1
  var TREE_CANOPY_FRAC = 0.52; // fraction of height above ground used as hit-circle center
  var TREE_RADIUS_FRAC = 0.30; // fraction of height used as hit-circle radius
  var TREE_FIRE_RADIUS = 34;
  var TREE_FIRE_DAMAGE = 25;
  var BURN_TURNS = 3;

  function randRange(a, b) { return a + Math.random() * (b - a); }
  function randInt(a, b) { return Math.floor(randRange(a, b + 1)); }

  // ---------- Terrain ----------
  // Heights are stored as fractions (0..1) of the current viewport height,
  // not absolute pixels, so the terrain stays correctly positioned if the
  // viewport height changes later (address bar hide/show, orientation
  // settling, fullscreen toggle) without needing to regenerate.
  var terrain = []; // fraction per integer x pixel, length WORLD_W+1

  // Big terrain mountains: a few large, smooth "bumps" layered on top of
  // the fine rolling-hill noise, so they read as dominant shapes instead of
  // just more wrinkles. Rather than one placement rule producing endless
  // small variations on the same shape, each match rolls one of several
  // distinct layout archetypes so sessions feel qualitatively different,
  // not just randomized in size/count.
  var terrainMountains = [];
  var currentLayoutName = "";

  function pickMountainLayout() {
    var roll = Math.random();
    if (roll < 0.15) return "Open Plains";
    if (roll < 0.40) return "The Ridge";
    if (roll < 0.60) return "Twin Peaks";
    if (roll < 0.80) return "Mountain Range";
    return "Off to the Side";
  }

  function generateTerrainMountains() {
    terrainMountains = [];
    var sorted = playerStartXs.slice().sort(function (a, b) { return a - b; });
    var loX = sorted[0], hiX = sorted[sorted.length - 1];
    var span = hiX - loX;

    function addMountain(cx, wLo, wHi, dLo, dHi) {
      terrainMountains.push({ cx: cx, width: randRange(wLo, wHi), peakDrop: randRange(dLo, dHi) });
    }
    function farFromAllPlayers(x, minDist) {
      return playerStartXs.every(function (px) { return Math.abs(x - px) >= minDist; });
    }
    // Sampled relative to the arena (the span across all active players)
    // plus a small buffer, not the full world - so "scattered" features
    // land near the action instead of lost out in the scenery wings.
    function randomArenaX() {
      var x, tries = 0;
      do {
        x = randRange(loX - ARENA_BUFFER, hiX + ARENA_BUFFER);
        tries++;
      } while (tries < 10 && !farFromAllPlayers(x, 300));
      return Math.max(0, Math.min(WORLD_W, x));
    }

    var layout = pickMountainLayout();
    currentLayoutName = layout;

    if (layout === "Open Plains") {
      // No mountains this match - just the fine rolling-hill texture.
    } else if (layout === "The Ridge") {
      // One big peak in a randomly chosen gap between two adjacent
      // players: every shot across that gap has to arc over it.
      var gapIndex = randInt(0, sorted.length - 2);
      var gMid = (sorted[gapIndex] + sorted[gapIndex + 1]) / 2;
      addMountain(gMid + randRange(-120, 120), 260, 380, 0.38, 0.52);
    } else if (layout === "Twin Peaks") {
      // A ridge flanking each side of the arena, leaving the middle more
      // open - rewards using your own peak as cover while dueling across
      // a clearer lane.
      addMountain(loX + span * 0.28 + randRange(-60, 60), 200, 320, 0.28, 0.42);
      addMountain(loX + span * 0.72 + randRange(-60, 60), 200, 320, 0.28, 0.42);
    } else if (layout === "Mountain Range") {
      // A rugged, scattered range across the arena - unpredictable
      // sightlines everywhere, but always near the action.
      var n = randInt(3, 4);
      for (var i = 0; i < n; i++) addMountain(randomArenaX(), 180, 340, 0.25, 0.48);
    } else {
      // Off to the Side: the arena itself stays clear, but a prominent
      // peak looms just past one end for movement/cover play.
      var outward = Math.random() < 0.5 ? loX - randRange(250, 500) : hiX + randRange(250, 500);
      outward = Math.max(WORLD_W * 0.03, Math.min(WORLD_W * 0.97, outward));
      addMountain(outward, 240, 380, 0.32, 0.50);
    }
  }

  function mountainBumpAt(x) {
    var total = 0;
    for (var i = 0; i < terrainMountains.length; i++) {
      var m = terrainMountains[i];
      var d = Math.abs(x - m.cx);
      if (d >= m.width) continue;
      var t = d / m.width;
      var falloff = Math.cos(t * Math.PI / 2);
      total += m.peakDrop * falloff * falloff;
    }
    return total;
  }

  function generateTerrain() {
    generateTerrainMountains();

    var segments = 9; // midpoint displacement depth -> 2^9 = 512 points
    var n = Math.pow(2, segments);
    var pts = new Array(n + 1);
    var baseline = 0.58;
    var roughness = 0.34;
    pts[0] = baseline + (Math.random() - 0.5) * roughness * 0.6;
    pts[n] = baseline + (Math.random() - 0.5) * roughness * 0.6;
    displace(pts, 0, n, roughness);

    // Resample to WORLD_W+1 integer columns.
    terrain = new Array(WORLD_W + 1);
    for (var x = 0; x <= WORLD_W; x++) {
      var t = (x / WORLD_W) * n;
      var i0 = Math.floor(t);
      var i1 = Math.min(n, i0 + 1);
      var f = t - i0;
      var h = pts[i0] * (1 - f) + pts[i1] * f;
      h -= mountainBumpAt(x);
      var minH = 0.05, maxH = 0.92;
      if (h < minH) h = minH;
      if (h > maxH) h = maxH;
      terrain[x] = h;
    }
  }

  function displace(pts, i0, i1, amp) {
    if (i1 - i0 < 2) return;
    var mid = (i0 + i1) >> 1;
    pts[mid] = (pts[i0] + pts[i1]) / 2 + (Math.random() - 0.5) * amp;
    displace(pts, i0, mid, amp * 0.56);
    displace(pts, mid, i1, amp * 0.56);
  }

  // Returns the terrain height in current screen pixels (fraction * VIEW_H).
  function terrainHeightAt(x) {
    return terrainFractionAt(x) * VIEW_H;
  }

  function terrainFractionAt(x) {
    x = Math.max(0, Math.min(WORLD_W, x));
    var xi = Math.floor(x);
    var xi1 = Math.min(WORLD_W, xi + 1);
    var f = x - xi;
    return terrain[xi] * (1 - f) + terrain[xi1] * f;
  }

  // Digs a small crater into the terrain around cx, deepest at the center
  // and tapering smoothly to nothing at the edge of the radius. Craters
  // stack, so repeated hits in the same spot dig progressively deeper.
  function deformTerrain(cx, radius, depth) {
    var xi0 = Math.max(0, Math.floor(cx - radius));
    var xi1 = Math.min(WORLD_W, Math.ceil(cx + radius));
    for (var xi = xi0; xi <= xi1; xi++) {
      var d = Math.abs(xi - cx) / radius;
      if (d > 1) continue;
      var falloff = Math.cos(d * Math.PI / 2);
      terrain[xi] = Math.min(0.97, terrain[xi] + depth * falloff);
    }
  }

  // ---------- Trees ----------
  var trees = []; // {x, state: 'alive'|'burning'|'ash', burnTurnsLeft, scale}
  var bgTrees = []; // decorative distant trees: {rx} in mountain parallax space

  function makeTree(x) {
    return { x: x, state: "alive", burnTurnsLeft: 0, scale: 0.95 + Math.random() * 0.55 };
  }

  function generateTrees(tankXs) {
    trees = [];
    var playMinX = Math.max(0, Math.min.apply(null, tankXs) - ARENA_BUFFER);
    var playMaxX = Math.min(WORLD_W, Math.max.apply(null, tankXs) + ARENA_BUFFER);
    var minDist = 90;

    function okX(x) {
      return tankXs.every(function (tx) { return Math.abs(x - tx) > minDist; });
    }

    // Density varies match to match, but every match gets a solid baseline
    // of trees - never bare or nearly bare.
    var roll = Math.random();
    var loneCount, clusterCount;
    if (roll < 0.3) { loneCount = randInt(6, 9); clusterCount = randInt(2, 3); }
    else if (roll < 0.7) { loneCount = randInt(9, 13); clusterCount = randInt(3, 4); }
    else { loneCount = randInt(13, 18); clusterCount = randInt(4, 6); }

    for (var i = 0; i < loneCount; i++) {
      var x = randRange(playMinX, playMaxX);
      var tries = 0;
      while (!okX(x) && tries < 12) { x = randRange(playMinX, playMaxX); tries++; }
      if (okX(x)) trees.push(makeTree(x));
    }

    for (var c = 0; c < clusterCount; c++) {
      var cx = randRange(playMinX, playMaxX);
      var n = randInt(4, 7);
      for (var j = 0; j < n; j++) {
        var tx = cx + (Math.random() - 0.5) * 130;
        tx = Math.max(playMinX, Math.min(playMaxX, tx));
        if (okX(tx)) trees.push(makeTree(tx));
      }
    }
  }

  function generateBgTrees() {

  // convention as terrain, so they stay correctly placed on resize.

  var gameConfig = { players: [] };

  // Sizes the arena around however many players are actually in the match:
  // each active player gets a fixed spacing budget (scaled by map size),
  // and the world is that arena plus a fixed scenery/panning margin on
  // each end - so terrain generation can treat "near the arena" and "the
  // far wings" as genuinely different zones instead of the arena being a
  // tiny sliver lost in a much bigger, mostly-irrelevant map.
  function computeArenaLayout() {
    var n = ACTIVE_SLOTS;
    var spacing = PLAYER_SPACING * MAP_SIZE_MULTIPLIER;
    var arenaSpan = spacing * Math.max(1, n - 1);
    WORLD_W = Math.round(arenaSpan + WING_MARGIN * 2);
    playerStartXs = [];
    for (var i = 0; i < n; i++) playerStartXs.push(Math.round(WING_MARGIN + i * spacing));
  }

  // ---------- Game state ----------
  var matchActive = false;
  var players; // array of 2 tank states
  var active = 0;
  var state = "aim"; // aim | flight | resolve | gameover
  var bullet = null;
  var impactFlash = null; // {x, y, t}
  var lastImpact = [null, null]; // per-player last shot landing spot {x, y, hitTank}

  // Camera: camCenterX/Y is the world point shown at the center of the
  // screen; camZoom scales world units to screen pixels. This center+zoom
  // model makes pinch-to-zoom straightforward (zoom around the pinch
  // midpoint) compared to a top-left-origin camera.
  var camCenterX = 0, camCenterY = 0, camZoom = 1;
  var activePointers = {}; // pointerId -> {x, y}
  var gestureMode = null; // null | 'pan' | 'pinch'
  var dragStartX = 0, dragStartY = 0, dragStartCamX = 0, dragStartCamY = 0;
  var pinchStartDist = 1, pinchStartZoom = 1, pinchAnchorWorldX = 0, pinchAnchorWorldY = 0;

  var mountainSeed1 = 0, mountainSeed2 = 0;

  function newTank(idx) {
    var startX = playerStartXs[idx];
    var cfg = gameConfig.players[idx];
    return {
      idx: idx,
      x: startX,
      health: HEALTH_MAX,
      fuel: FUEL_MAX,
      angle: 55,
      power: 55,
      name: cfg.name,
      color: cfg.color,
      colorDark: cfg.colorDark,
      alive: true
    };
  }

  function startMatch() {
    computeArenaLayout();
    generateTerrain();
    players = [newTank(0), newTank(1)];
    active = 0;
    state = "aim";
    bullet = null;
    impactFlash = null;
    lastImpact = [null, null];
    mountainSeed1 = Math.random() * 1000;
    mountainSeed2 = Math.random() * 1000;
    generateTrees([players[0].x, players[1].x]);
    generateBgTrees();
    generateClouds();
    camZoom = 1;
    centerCameraOnActive();
    updateTurnUI();
    showToast("Terrain: " + currentLayoutName);
    document.getElementById("overlay").classList.remove("show");
  }

  // Terrain/cloud heights are stored as fractions of VIEW_H with worldY=0
  // meaning "top of the classic (pre-zoom) viewport" - so the camera's
  // default vertical framing has to put worldY=0 at the screen top, i.e.
  // center on worldY = VIEW_H/2, not on worldY = 0.
  function defaultCamCenterY() { return VIEW_H / 2; }

  function centerCameraOnActive() {
    camCenterX = players[active].x;
    camCenterY = defaultCamCenterY();
    clampCam();
  }

  function recenterView() {
    camZoom = 1;
    centerCameraOnActive();
  }

  function clampCam() {
    var halfW = (VIEW_W / 2) / camZoom;
    if (WORLD_W > halfW * 2) {
      camCenterX = Math.max(halfW, Math.min(WORLD_W - halfW, camCenterX));
    } else {
      camCenterX = WORLD_W / 2;
    }
    var base = defaultCamCenterY();
    var camYMin = base - VIEW_H * 2.0, camYMax = base + VIEW_H * 1.4;
    camCenterY = Math.max(camYMin, Math.min(camYMax, camCenterY));
  }

  function screenToWorld(sx, sy) {
    return {
      x: camCenterX + (sx - VIEW_W / 2) / camZoom,
      y: camCenterY + (sy - VIEW_H / 2) / camZoom
    };
  }

  // ---------- Input: buttons (press-and-hold) ----------
  var held = {}; // key -> true while pressed

  function bindHold(id, key) {
    var el = document.getElementById(id);
    function down(e) { e.preventDefault(); held[key] = true; el.classList.add("held"); }
    function up(e) { if (e) e.preventDefault(); held[key] = false; el.classList.remove("held"); }
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    el.addEventListener("pointerleave", up);
  }
  bindHold("btnLeft", "left");
  bindHold("btnRight", "right");
  bindHold("btnAngleUp", "angleUp");
  bindHold("btnAngleDown", "angleDown");
  bindHold("btnPowerUp", "powerUp");
  bindHold("btnPowerDown", "powerDown");

  document.getElementById("fireBtn").addEventListener("pointerdown", function (e) {
    e.preventDefault();
    fire();

  document.getElementById("recenterBtn").addEventListener("pointerdown", function (e) {

  document.getElementById("backToSetupBtn").addEventListener("pointerdown", function (e) {
    e.preventDefault();
    matchActive = false;
    document.getElementById("overlay").classList.remove("show");
    showScreen("screenPlayers");
  });

  // ---------- Fullscreen toggle ----------
  var FS_ICON_EXPAND = '<path d="M4 9V4h5"></path><path d="M20 9V4h-5"></path><path d="M4 15v5h5"></path><path d="M20 15v5h-5"></path>';
  var FS_ICON_COMPRESS = '<path d="M9 4v5H4"></path><path d="M15 4v5h5"></path><path d="M9 20v-5H4"></path><path d="M15 20v-5h5"></path>';

  function updateFsButton() {
    var isFs = !!document.fullscreenElement;
    document.getElementById("fsIcon").innerHTML = isFs ? FS_ICON_COMPRESS : FS_ICON_EXPAND;
    document.getElementById("fsLabel").textContent = isFs ? "Exit" : "Fullscreen";
  }
  document.addEventListener("fullscreenchange", updateFsButton);
  updateFsButton();

  document.getElementById("fsBtn").addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(function () {});
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("landscape").catch(function () {});
      }
    } else {
      document.exitFullscreen().catch(function () {});
    }
  });

  // ---------- Input: drag to pan, pinch to zoom ----------
  function pointerIds() { return Object.keys(activePointers); }
  function ptrDist(idA, idB) {
    var a = activePointers[idA], b = activePointers[idB];
    return Math.max(1, Math.hypot(a.x - b.x, a.y - b.y));
  }
  function ptrMid(idA, idB) {
    var a = activePointers[idA], b = activePointers[idB];
    return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  }
  function beginPan(id) {
    gestureMode = "pan";
    dragStartX = activePointers[id].x;
    dragStartY = activePointers[id].y;
    dragStartCamX = camCenterX;
    dragStartCamY = camCenterY;
  }

  canvasWrap.addEventListener("pointerdown", function (e) {
    if (state === "gameover") return;
    activePointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = pointerIds();
    if (ids.length === 2) {
      gestureMode = "pinch";
      pinchStartDist = ptrDist(ids[0], ids[1]);
      pinchStartZoom = camZoom;
      var mid = ptrMid(ids[0], ids[1]);
      var w = screenToWorld(mid.x, mid.y);
      pinchAnchorWorldX = w.x;
      pinchAnchorWorldY = w.y;
    } else if (ids.length === 1) {
      beginPan(ids[0]);
    }
  });
  canvasWrap.addEventListener("pointermove", function (e) {
    if (!(e.pointerId in activePointers)) return;
    activePointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = pointerIds();
    if (gestureMode === "pinch" && ids.length === 2) {
      var dist = ptrDist(ids[0], ids[1]);
      camZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, pinchStartZoom * (dist / pinchStartDist)));
      var mid = ptrMid(ids[0], ids[1]);
      camCenterX = pinchAnchorWorldX - (mid.x - VIEW_W / 2) / camZoom;
      camCenterY = pinchAnchorWorldY - (mid.y - VIEW_H / 2) / camZoom;
      clampCam();
    } else if (gestureMode === "pan" && ids.length === 1) {
      var dx = e.clientX - dragStartX;
      var dy = e.clientY - dragStartY;
      camCenterX = dragStartCamX - dx / camZoom;
      camCenterY = dragStartCamY - dy / camZoom;
      clampCam();
    }
  });
  function releasePointer(e) {
    delete activePointers[e.pointerId];
    var ids = pointerIds();
    if (ids.length === 1) {
      beginPan(ids[0]);
    } else {
      gestureMode = null;
    }
  }
  canvasWrap.addEventListener("pointerup", releasePointer);
  canvasWrap.addEventListener("pointercancel", releasePointer);

  // ---------- Firing ----------
  function fire() {
    if (state !== "aim") return;
    var p = players[active];
    var rad = p.angle * Math.PI / 180;
    var dir = p.idx === 0 ? 1 : -1;
    var speed = p.power * POWER_TO_SPEED;
    bullet = {
      x: p.x + dir * (TANK_HALF_W + 6),
      y: terrainHeightAt(p.x) - TANK_HALF_H - 10,
      vx: Math.cos(rad) * speed * dir,
      vy: -Math.sin(rad) * speed
    };
    state = "flight";
  }

  function resolveImpact(x, y, hitTank, hitDist) {
    var dmg = null;
    if (hitTank) {
      var t = Math.max(0, Math.min(1, (hitDist || 0) / HIT_RADIUS));
      dmg = Math.round(MAX_DAMAGE - (MAX_DAMAGE - MIN_DAMAGE) * t);
      hitTank.health = Math.max(0, hitTank.health - dmg);
    }
    impactFlash = { x: x, y: y, t: 0.5, damageText: dmg };
    lastImpact[active] = { x: x, y: y, hitTank: !!hitTank };
    bullet = null;
    if (x >= 0 && x <= WORLD_W) deformTerrain(x, CRATER_RADIUS, CRATER_DEPTH);
    state = "resolve";
  }

  function applyTreeFireDamage() {
    var messages = [];
    for (var i = 0; i < players.length; i++) {
      var p = players[i];
      var burned = trees.some(function (t) {
        return t.state === "burning" && Math.abs(p.x - t.x) < TREE_FIRE_RADIUS;
      });
      if (burned) {
        p.health = Math.max(0, p.health - TREE_FIRE_DAMAGE);
        messages.push(p.name + " took " + TREE_FIRE_DAMAGE + " HP from a burning tree!");
      }
    }
    if (messages.length) showToast("🔥 " + messages.join(" "));
  }

  function decayTrees() {
    trees.forEach(function (t) {
      if (t.state === "burning") {
        t.burnTurnsLeft--;
        if (t.burnTurnsLeft <= 0) t.state = "ash";
      }
    });
  }

  function afterResolve() {
    applyTreeFireDamage();

    var loser = players.filter(function (p) { return p.health <= 0; })[0];
    if (loser) {
      var winner = players[1 - loser.idx];
      document.getElementById("winText").textContent = winner.name + " Wins!";
      document.getElementById("overlay").classList.add("show");
      state = "gameover";
      return;
    }
    decayTrees();
    active = 1 - active;
    players[active].fuel = FUEL_MAX;
    state = "aim";
    centerCameraOnActive();
    updateTurnUI();
  }

  // ---------- UI text ----------
  function hexToRgb(hex) {
    var v = parseInt(hex.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }
  function mixHex(hexA, hexB, t) {
    var a = hexToRgb(hexA), b = hexToRgb(hexB);
    var r = Math.round(a[0] + (b[0] - a[0]) * t);
    var g = Math.round(a[1] + (b[1] - a[1]) * t);
    var bl = Math.round(a[2] + (b[2] - a[2]) * t);
    return "rgb(" + r + "," + g + "," + bl + ")";
  }

  function updateTurnUI() {
    var p = players[active];
    document.getElementById("turnLabel").textContent = p.name + "'s Turn";
    document.getElementById("turnLabel").style.color = p.color;

    var bar = document.getElementById("bar");
    var rgb = hexToRgb(p.color);
    bar.style.setProperty("--accent", p.color);
    bar.style.setProperty("--accent-bg", mixHex(p.color, "#1b1f27", 0.72));
    bar.style.setProperty("--accent-glow", "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ",.45)");
  }
  function updateFuelUI() {
    var pct = Math.max(0, players[active].fuel) / FUEL_MAX * 100;
    document.getElementById("fuelFill").style.width = pct + "%";
  }
  function updateAimUI() {
    var p = players[active];
    document.getElementById("angleVal").textContent = Math.round(p.angle);
    document.getElementById("powerVal").textContent = Math.round(p.power);
  }

  var toastTimeoutHandle = null;
  function showToast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimeoutHandle);
    toastTimeoutHandle = setTimeout(function () { el.classList.remove("show"); }, 2800);
  }

  // ---------- Update loop ----------
  var lastT = null;
  function update(dt) {
    if (state === "aim") {
      var p = players[active];
      if (held.angleUp) p.angle = Math.min(ANGLE_MAX, p.angle + ANGLE_RATE * dt);
      if (held.angleDown) p.angle = Math.max(ANGLE_MIN, p.angle - ANGLE_RATE * dt);
      if (held.powerUp) p.power = Math.min(POWER_MAX, p.power + POWER_RATE * dt);
      if (held.powerDown) p.power = Math.max(POWER_MIN, p.power - POWER_RATE * dt);

      if (p.fuel > 0) {
        var mv = 0;
        if (held.left) mv -= 1;
        if (held.right) mv += 1;
        if (mv !== 0) {
          var dist = MOVE_SPEED * dt;
          p.x += mv * dist;
          p.x = Math.max(10, Math.min(WORLD_W - 10, p.x));
          p.fuel = Math.max(0, p.fuel - FUEL_PER_SEC * dt);
          // Auto-follow horizontally while driving so the tank never drifts
          // out of view; vertical framing/zoom stay untouched.
          camCenterX = p.x;
          clampCam();
        }
      }
      updateFuelUI();
      updateAimUI();
    } else if (state === "flight") {
      bullet.vy += GRAVITY * dt;
      bullet.x += bullet.vx * dt;
      bullet.y += bullet.vy * dt;

      // camera follows bullet
      camCenterX = bullet.x;
      camCenterY = bullet.y;
      clampCam();

      var defender = players[1 - active];
      var dx = bullet.x - defender.x;
      var dy = bullet.y - (terrainHeightAt(defender.x) - TANK_HALF_H);
      var dist2 = dx * dx + dy * dy;

      var hitTree = null;
      for (var ti = 0; ti < trees.length; ti++) {
        var tr = trees[ti];
        if (tr.state !== "alive") continue;
        var tH = TREE_BASE_HEIGHT * tr.scale;
        var tCanopyY = terrainHeightAt(tr.x) - tH * TREE_CANOPY_FRAC;
        var tdx = bullet.x - tr.x, tdy = bullet.y - tCanopyY;
        var tRadius = tH * TREE_RADIUS_FRAC;
        if (tdx * tdx + tdy * tdy <= tRadius * tRadius) { hitTree = tr; break; }
      }

      if (hitTree) {
        hitTree.state = "burning";
        hitTree.burnTurnsLeft = BURN_TURNS;
        resolveImpact(bullet.x, bullet.y, null);
      } else if (bullet.x < 0 || bullet.x > WORLD_W) {
        resolveImpact(bullet.x, bullet.y, null);
      } else if (dist2 <= HIT_RADIUS * HIT_RADIUS) {
        resolveImpact(bullet.x, bullet.y, defender, Math.sqrt(dist2));
      } else if (bullet.y >= terrainHeightAt(bullet.x)) {
        resolveImpact(bullet.x, terrainHeightAt(bullet.x), null);
      }
    } else if (state === "resolve") {
      impactFlash.t -= dt;
      if (impactFlash.t <= 0) {
        impactFlash = null;
        afterResolve();
      }
    }
  }

  // ---------- Render ----------
  // Sky/mountains are drawn in plain screen space (not the world zoom/pan
  // transform) - the backdrop doesn't magnify with zoom, only the world
  // layer does. The gradient's colors are still altitude-aware: panning up
  // into the taller sky shifts the sampled colors toward a darker blue.
  function skyColorAt(worldY) {
    var f = worldY / VIEW_H;
    var dark = [0x22, 0x34, 0x5c];
    var top = [0x7f, 0xa8, 0xcf];
    var bot = [0xc9, 0xdc, 0xed];
    var c;
    if (f <= 0) {
      var t = Math.max(0, Math.min(1, (f + 1.4) / 1.4));
      c = lerpColor(dark, top, t);
    } else {
      c = lerpColor(top, bot, Math.max(0, Math.min(1, f)));
    }
    return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")";
  }
  function lerpColor(a, b, t) {
    return [
      Math.round(a[0] + (b[0] - a[0]) * t),
      Math.round(a[1] + (b[1] - a[1]) * t),
      Math.round(a[2] + (b[2] - a[2]) * t)
    ];
  }

  function drawBackground() {
    var halfH = (VIEW_H / 2) / camZoom;
    var worldTop = camCenterY - halfH;
    var worldBottom = camCenterY + halfH;
    var g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
    var stops = 6;
    for (var i = 0; i <= stops; i++) {
      var f = i / stops;
      g.addColorStop(f, skyColorAt(worldTop + (worldBottom - worldTop) * f));
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    drawMountainLayer(mountainSeed1, 0.12, 0.22, "#7793ab", VIEW_H * 0.62, VIEW_H * 0.20, 0.0021, 0.006, false);
    drawMountainLayer(mountainSeed2, 0.28, 0.32, "#5c7a99", VIEW_H * 0.72, VIEW_H * 0.15, 0.004, 0.011, true);
  }

  function mountainHeightAt(wx, baseY, amp, freq1, freq2) {
    return baseY - amp * Math.sin(wx * freq1) - amp * 0.5 * Math.sin(wx * freq2 + 1.5);
  }

  function drawMountainLayer(seed, parallaxFactor, alpha, color, baseY, amp, freq1, freq2, withTrees) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    var parallax = camCenterX * parallaxFactor;
    ctx.beginPath();
    ctx.moveTo(0, VIEW_H);
    for (var x = 0; x <= VIEW_W; x += 30) {
      var h = mountainHeightAt(x + parallax + seed, baseY, amp, freq1, freq2);
      ctx.lineTo(x, h);
    }
    ctx.lineTo(VIEW_W, VIEW_H);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    if (withTrees) {
      ctx.save();
      ctx.globalAlpha = alpha + 0.15;
      for (var i = 0; i < bgTrees.length; i++) {
        var sx = bgTrees[i].rx - parallax;
        if (sx < -20 || sx > VIEW_W + 20) continue;
        var h2 = mountainHeightAt(bgTrees[i].rx + seed, baseY, amp, freq1, freq2);
        drawPineTree(sx, h2 + 2, 20 * bgTrees[i].scale, color, color);
      }
      ctx.restore();
    }
  }

  function drawTerrain() {
    var halfW = (VIEW_W / 2) / camZoom;
    var x0 = Math.max(0, Math.floor(camCenterX - halfW));
    var x1 = Math.min(WORLD_W, Math.ceil(camCenterX + halfW));
    var bottom = 20000; // always far below any pannable/zoomed-out range

    ctx.beginPath();
    ctx.moveTo(x0, bottom);
    for (var x = x0; x <= x1; x += 2) {
      ctx.lineTo(x, terrainHeightAt(x));
    }
    ctx.lineTo(x1, bottom);
    ctx.closePath();
    ctx.fillStyle = "#6b4a2f"; // brown body
    ctx.fill();

    // green cap
    ctx.beginPath();
    var first = true;
    for (var xg = x0; xg <= x1; xg += 2) {
      var hy = terrainHeightAt(xg);
      if (first) { ctx.moveTo(xg, hy); first = false; }
      else ctx.lineTo(xg, hy);
    }
    ctx.lineWidth = 6 / camZoom;
    ctx.strokeStyle = "#3f8f3f";
    ctx.stroke();
  }

  function drawTank(p) {
    var sx = p.x;
    var groundY = terrainHeightAt(p.x);
    var cy = groundY - TANK_HALF_H;

    ctx.save();
    ctx.translate(sx, cy);

    // body
    ctx.fillStyle = p.color;
    ctx.strokeStyle = p.colorDark;
    ctx.lineWidth = 2 / camZoom;
    roundRect(-TANK_HALF_W, -TANK_HALF_H, TANK_HALF_W * 2, TANK_HALF_H * 2, 5);
    ctx.fill(); ctx.stroke();

    // wheels
    ctx.fillStyle = "#22262f";
    ctx.beginPath(); ctx.arc(-TANK_HALF_W + 6, TANK_HALF_H, 6, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(TANK_HALF_W - 6, TANK_HALF_H, 6, 0, 7); ctx.fill();

    // barrel
    var dir = p.idx === 0 ? 1 : -1;
    var rad = p.angle * Math.PI / 180;
    var bx = Math.cos(rad) * dir;
    var by = -Math.sin(rad);
    ctx.strokeStyle = p.colorDark;
    ctx.lineWidth = 5 / camZoom;
    ctx.beginPath();
    ctx.moveTo(0, -4);
    ctx.lineTo(bx * 26, -4 + by * 26);
    ctx.stroke();

    ctx.restore();

    // aim arrow (active tank only, during aim)
    if (state === "aim" && p.idx === active) {
      var len = 20 + (p.power / POWER_MAX) * 55;
      ctx.strokeStyle = "rgba(255,255,60,0.9)";
      ctx.lineWidth = 3 / camZoom;
      ctx.beginPath();
      ctx.moveTo(sx, cy - 4);
      ctx.lineTo(sx + bx * len, cy - 4 + by * len);
      ctx.stroke();
      // arrow head
      ctx.beginPath();
      var hx = sx + bx * len, hy = cy - 4 + by * len;
      ctx.moveTo(hx, hy);
      ctx.lineTo(hx - bx * 8 - by * 5, hy - by * 8 + bx * 5);
      ctx.lineTo(hx - bx * 8 + by * 5, hy - by * 8 - bx * 5);
      ctx.closePath();
      ctx.fillStyle = "rgba(255,255,60,0.9)";
      ctx.fill();
    }

    // health bar BELOW tank
    var barW = 40, barH = 5;
    var bx0 = sx - barW / 2, by0 = groundY + 10;
    ctx.fillStyle = "#20242c";
    ctx.fillRect(bx0, by0, barW, barH);
    var pct = Math.max(0, p.health) / HEALTH_MAX;
    ctx.fillStyle = pct > 0.4 ? "#4caf50" : (pct > 0.15 ? "#e0b93a" : "#d1432c");
    ctx.fillRect(bx0, by0, barW * pct, barH);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBullet() {
    if (!bullet) return;
    ctx.fillStyle = "#1a1a1a";
    ctx.beginPath();
    ctx.arc(bullet.x, bullet.y, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawFlash() {
    if (!impactFlash) return;
    var progress = 1 - impactFlash.t / 0.5;
    var r = 18 * (1 - progress) + 6;
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - progress);
    ctx.fillStyle = "#ffdd55";
    ctx.beginPath();
    ctx.arc(impactFlash.x, impactFlash.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (impactFlash.damageText != null) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - progress);
      ctx.fillStyle = "#fff59d";
      ctx.strokeStyle = "rgba(0,0,0,0.6)";
      ctx.lineWidth = 3 / camZoom;
      ctx.font = "bold " + Math.round(16 / camZoom) + "px sans-serif";
      ctx.textAlign = "center";
      var ty = impactFlash.y - (14 + progress * 22) / camZoom;
      var label = "-" + impactFlash.damageText;
      ctx.strokeText(label, impactFlash.x, ty);
      ctx.fillText(label, impactFlash.x, ty);
      ctx.restore();
    }
  }

  // A simple stacked-triangle conifer icon (evokes the pine emoji shape
  // without depending on the platform's emoji font/colors).
  function drawPineTree(x, groundY, h, foliageColor, trunkColor) {
    var trunkH = h * 0.16, trunkW = h * 0.13;
    ctx.fillStyle = trunkColor;
    ctx.fillRect(x - trunkW / 2, groundY - trunkH, trunkW, trunkH);

    var layers = [
      { w: h * 0.66, h: h * 0.44, yOff: trunkH * 0.5 },
      { w: h * 0.52, h: h * 0.40, yOff: trunkH * 0.5 + h * 0.44 * 0.55 },
      { w: h * 0.37, h: h * 0.36, yOff: trunkH * 0.5 + h * 0.44 * 0.55 + h * 0.40 * 0.55 }
    ];
    ctx.fillStyle = foliageColor;
    layers.forEach(function (l) {
      var by = groundY - l.yOff;
      ctx.beginPath();
      ctx.moveTo(x, by - l.h);
      ctx.lineTo(x - l.w / 2, by);
      ctx.lineTo(x + l.w / 2, by);
      ctx.closePath();
      ctx.fill();
    });
  }

  function drawTree(t) {
    var sx = t.x;
    var groundY = terrainHeightAt(t.x);
    var h = TREE_BASE_HEIGHT * t.scale;

    ctx.save();
    if (t.state === "burning") {
      ctx.shadowColor = "rgba(255,110,20,0.95)";
      ctx.shadowBlur = 16;
      drawPineTree(sx, groundY + 1, h, "#c94a1e", "#5b3a22");
      ctx.shadowBlur = 0;
    } else if (t.state === "ash") {
      ctx.globalAlpha = 0.7;
      drawPineTree(sx, groundY + 1, h, "#4a4a4a", "#3a3a3a");
    } else {
      drawPineTree(sx, groundY + 1, h, "#2e7d32", "#5b3a22");
    }
    ctx.restore();
  }

  function drawTrees(filterState) {
    trees.forEach(function (t) { if (t.state === filterState) drawTree(t); });
  }

  function drawImpactMarks() {
    for (var i = 0; i < lastImpact.length; i++) {
      var mark = lastImpact[i];
      if (!mark || mark.hitTank) continue;
      var mx = mark.x;
      ctx.save();
      ctx.strokeStyle = players[i].color;
      ctx.globalAlpha = 0.85;
      ctx.lineWidth = 3 / camZoom;
      var r = 7;
      ctx.beginPath();
      ctx.moveTo(mx - r, mark.y - r); ctx.lineTo(mx + r, mark.y + r);
      ctx.moveTo(mx + r, mark.y - r); ctx.lineTo(mx - r, mark.y + r);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawCloud(c) {
    var y = c.yFrac * VIEW_H;
    var s = 26 * c.scale;
    var lobes = [
      [-0.7, 0, 0.55], [0, -0.25, 0.7], [0.7, 0, 0.55], [-0.15, 0.2, 0.6], [0.55, 0.15, 0.5]
    ];
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = "#ffffff";
    lobes.forEach(function (l) {
      ctx.beginPath();
      ctx.arc(c.x + l[0] * s, y + l[1] * s, l[2] * s, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  function drawClouds() {
    clouds.forEach(drawCloud);
  }

  function render() {
    drawBackground();
    ctx.save();
    ctx.translate(VIEW_W / 2, VIEW_H / 2);
    ctx.scale(camZoom, camZoom);
    ctx.translate(-camCenterX, -camCenterY);
    drawTerrain();
    drawImpactMarks();
    drawTrees("ash");
    players.forEach(drawTank);
    drawTrees("alive");
    drawTrees("burning");
    drawBullet();
    drawFlash();
    drawClouds();
    ctx.restore();
  }

  // ---------- Main loop ----------
  function frame(t) {
    if (lastT === null) lastT = t;
    var dt = Math.min(0.05, (t - lastT) / 1000);
    lastT = t;
    if (matchActive) {
      update(dt);
      render();
    }
    requestAnimationFrame(frame);
  }

  function beginMatchFromConfig() {
    applyPlayerConfigToGame();
    showScreen("screenMatch");
    resizeCanvas();
    matchActive = true;
    startMatch();
  }

  // ---------- Boot ----------
  function boot() {
    renderPlayerRows();
    showScreen("screenWelcome");
    requestAnimationFrame(frame);
  }
  boot();

  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
